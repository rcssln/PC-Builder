<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compare PC components or complete builds side by side.">
  <title>Comparison · Digital PC Builder</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="comparison" data-root="../">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <div class="eyebrow">Comparison</div>
          <h1>Compare components &amp; builds</h1>
          <p>Side-by-side tables with price, specifications, estimated performance, power, compatibility and price-to-performance. The best value in each row is highlighted.</p>
        </div>
        
      </div>
      <div class="tabs" id="cmp-tabs" role="tablist">
        <button class="tab active" data-tab="components" role="tab">Components</button>
        <button class="tab" data-tab="builds" role="tab">Complete builds</button>
      </div>

      <section id="panel-components">
        <div class="card" style="margin-bottom:18px">
          <div class="grid" style="grid-template-columns:repeat(5, minmax(0, 1fr));align-items:end">
            <label class="field"><span>Category</span><select id="cc-cat"></select></label>
            <div id="cc-slots" style="display:contents"></div>
          </div>
        </div>
        <div id="cc-result"></div>
      </section>

      <section id="panel-builds" class="hidden">
        <div class="card" style="margin-bottom:18px">
          <div class="row-between" style="margin-bottom:12px"><h3 style="margin:0">Select 2–4 builds</h3>
            <label class="field" style="min-width:180px"><span>Resolution for FPS</span><select id="cb-res"></select></label></div>
          <div class="grid grid-4" id="cb-list"></div>
        </div>
        <div id="cb-result"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/performance.js"></script>
  <script src="../js/compatibility.js"></script>
  <script src="../js/recommendations.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/comparison.js"></script>
</body>
</html>
