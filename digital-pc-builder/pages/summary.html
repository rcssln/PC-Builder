<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Complete summary of your PC build with cost, compatibility and performance.">
  <title>Build Summary · Digital PC Builder</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="summary" data-root="../">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <div class="eyebrow">Build Summary</div>
          <h1>Build summary</h1>
          <p>Complete parts list, total cost, compatibility status, power requirements and performance overview.</p>
        </div>
        <div class="row no-print" id="summary-actions">
          <button class="btn btn-primary" id="btn-sum-save">Save build</button>
          <button class="btn" id="btn-sum-edit">Edit in builder</button>
          <button class="btn" id="btn-sum-print">Print / PDF</button>
          <button class="btn" id="btn-sum-json">Export JSON</button>
          <button class="btn" id="btn-sum-csv">Export CSV</button>
          <button class="btn" id="btn-sum-copy">Copy text</button>
          <button class="btn btn-danger hidden" id="btn-sum-delete">Delete</button>
        </div>
      </div>
      <div class="print-only"><h2>Digital PC Builder: build summary</h2></div>
      <div id="summary"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/main.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/performance.js"></script>
  <script src="../js/compatibility.js"></script>
  <script src="../js/recommendations.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/summary.js"></script>
</body>
</html>
