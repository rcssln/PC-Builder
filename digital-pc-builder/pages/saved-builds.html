<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your saved PC builds.">
  <title>Saved Builds · Digital PC Builder</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="saved" data-root="../">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <div class="eyebrow">Saved Builds</div>
          <h1>Saved builds</h1>
          <p>Load a build to edit it, view its summary, duplicate, export, delete, or select several to compare.</p>
        </div>
        <div class="row">
          <button class="btn btn-primary" id="btn-new">+ New build</button>
          <button class="btn" id="btn-import">Import JSON</button>
          <button class="btn btn-secondary" id="btn-compare" disabled>Compare selected</button>
          <input type="file" id="import-file" accept=".json,application/json" class="hidden">
        </div>
      </div>
      <div class="notice notice-info hidden" id="sb-migrate" style="margin-bottom:16px"></div>
      <div class="row-between" style="margin-bottom:16px">
        <div class="row grow" style="max-width:560px">
          <input type="search" id="sb-search" placeholder="Search saved builds" class="grow" style="width:auto" aria-label="Search saved builds">
          <select id="sb-sort" style="width:auto" aria-label="Sort saved builds">
            <option value="recent">Most recent</option><option value="name">Name</option>
            <option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option>
          </select>
        </div>
        <span class="small muted" id="sb-count"></span>
      </div>
      <div class="grid grid-3" id="sb-list"></div>
      <div id="sb-pager"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/main.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/performance.js"></script>
  <script src="../js/compatibility.js"></script>
  <script src="../js/recommendations.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/saved-builds.js"></script>
</body>
</html>
